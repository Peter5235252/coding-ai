    <script>
      // Gracefully suppress Vite dev client WebSocket reconnection errors in iframe/proxy
      window.addEventListener('error', function(event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           event.message.includes('createWebSocketModuleRunnerTransport') ||
           event.filename?.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? String(event.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
